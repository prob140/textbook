name: Accessibility Checks

on:
  push:
    branches:
      - master
  pull_request:
  
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  axe-check:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      # 4. Run axe accessibility checks (this step will build the site)
      - name: Run Axe Accessibility Checks
        uses: berkeley-cdss/myst-a11y@v1
        with:
          base_url: '/${{ github.event.repository.name }}'
          exclude: "iframe[src*='youtube.com'], #movie_player"

      # 5. Custom video accessibility checker
      - name: Check video embeds for accessibility
        if: always()  # Run this step even if axe accessibility checks fail
        run: python .github/scripts/check-video-accessibility.py _build/html
